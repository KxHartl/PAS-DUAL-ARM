controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    pan_tilt_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: position_controllers/GripperActionController

    right_gripper_controller:
      type: position_controllers/GripperActionController

    base_controller:
      type: mecanum_drive_controller/MecanumDriveController

# 4-wheel mecanum base controlled via mecanum_drive_controller.
# Wheel joints:
#   front_left: wheel_front_left_joint
#   front_right: wheel_front_right_joint
#   rear_left: wheel_rear_left_joint
#   rear_right: wheel_rear_right_joint
# Kinematics:
#   wheel_radius: 0.0762 m
#   lx = 0.488 / 2 = 0.244 m
#   ly = 0.44715 / 2 = 0.223575 m
#   sum_of_robot_center_projection_on_X_Y_axis = 0.467575 m
base_controller:
  ros__parameters:
    reference_timeout: 0.5
    front_left_wheel_command_joint_name: wheel_front_left_joint
    front_right_wheel_command_joint_name: wheel_front_right_joint
    rear_right_wheel_command_joint_name: wheel_rear_right_joint
    rear_left_wheel_command_joint_name: wheel_rear_left_joint
    front_left_wheel_state_joint_name: wheel_front_left_joint
    front_right_wheel_state_joint_name: wheel_front_right_joint
    rear_right_wheel_state_joint_name: wheel_rear_right_joint
    rear_left_wheel_state_joint_name: wheel_rear_left_joint
    use_stamped_vel: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    kinematics:
      wheels_radius: 0.0762
      sum_of_robot_center_projection_on_X_Y_axis: 0.467575
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - left_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6
      - right_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

torso_controller:
  ros__parameters:
    joints:
      - torso_left_carriage_joint
      - torso_right_carriage_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 3.0
      torso_left_carriage_joint:
        goal: 0.01
      torso_right_carriage_joint:
        goal: 0.01
    gains:
      torso_left_carriage_joint: {p: 1500.0, i: 500.0, d: 100.0, i_clamp: 300.0}
      torso_right_carriage_joint: {p: 1500.0, i: 500.0, d: 100.0, i_clamp: 300.0}

pan_tilt_controller:
  ros__parameters:
    joints:
      - pan_tilt_yaw_joint
      - pan_tilt_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

left_gripper_controller:
  ros__parameters:
    joint: left_robotiq_85_left_knuckle_joint
    allow_stalling: true

right_gripper_controller:
  ros__parameters:
    joint: right_robotiq_85_left_knuckle_joint
    allow_stalling: true
