controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    pan_tilt_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: position_controllers/GripperActionController

    right_gripper_controller:
      type: position_controllers/GripperActionController

    base_controller:
      type: diff_drive_controller/DiffDriveController

# The base wheels are driven through ros2_control like every other joint (the PAL
# ros2_control block targets Gazebo Classic, and the Fortress built-in drive
# systems never instantiate on this install). 4-wheel skid-steer via
# diff_drive_controller gives x + yaw, which is all the task needs, and provides
# wheel-encoder odometry + odom->base_footprint TF like on a real robot.
base_controller:
  ros__parameters:
    left_wheel_names: [wheel_front_left_joint, wheel_rear_left_joint]
    right_wheel_names: [wheel_front_right_joint, wheel_rear_right_joint]
    wheel_separation: 0.44715
    wheel_radius: 0.0762
    use_stamped_vel: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.6
    linear.x.min_velocity: -0.6
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - left_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6
      - right_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

torso_controller:
  ros__parameters:
    joints:
      - torso_left_carriage_joint
      - torso_right_carriage_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

pan_tilt_controller:
  ros__parameters:
    joints:
      - pan_tilt_yaw_joint
      - pan_tilt_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

left_gripper_controller:
  ros__parameters:
    joint: left_robotiq_85_left_knuckle_joint
    allow_stalling: true

right_gripper_controller:
  ros__parameters:
    joint: right_robotiq_85_left_knuckle_joint
    allow_stalling: true
