    gains:
      right_joint_1:
        p: 387.0
        i: 193.5
        d: 5.16
        i_clamp: 39.0
      right_joint_2:
        p: 10181.25
        i: 5090.625
        d: 135.75
        i_clamp: 39.0
      right_joint_3:
        p: 265.5
        i: 132.75
        d: 3.54
        i_clamp: 39.0
      right_joint_4:
        p: 4524.75
        i: 2262.375
        d: 60.33
        i_clamp: 39.0
      right_joint_5:
        p: 177.75
        i: 88.875
        d: 2.37
        i_clamp: 9.0
