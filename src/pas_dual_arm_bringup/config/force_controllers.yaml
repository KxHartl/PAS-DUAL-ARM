torso_controller:
  ros__parameters:
    joints:
    - torso_left_carriage_joint
    - torso_right_carriage_joint
    command_interfaces:
    - effort
    state_interfaces:
    - position
    - velocity
    constraints:
      goal_time: 3.0
      torso_left_carriage_joint:
        goal: 0.01
      torso_right_carriage_joint:
        goal: 0.01
    gains:
      torso_left_carriage_joint:
        p: 1500.0
        i: 500.0
        d: 100.0
        i_clamp: 300.0
      torso_right_carriage_joint:
        p: 1500.0
        i: 500.0
        d: 100.0
        i_clamp: 300.0
pan_tilt_controller:
  ros__parameters:
    joints:
    - pan_tilt_yaw_joint
    - pan_tilt_pitch_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
left_gripper_controller:
  ros__parameters:
    joint: left_robotiq_85_left_knuckle_joint
    allow_stalling: true
right_gripper_controller:
  ros__parameters:
    joint: right_robotiq_85_left_knuckle_joint
    allow_stalling: true
