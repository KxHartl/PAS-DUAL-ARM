bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Has to be under the goal tolerance above, or the final approach cannot
      # satisfy it: once inside 5 cm of the goal the robot will never travel the
      # 10 cm this used to demand, and after 30 s Nav2 calls a healthy robot
      # stuck and starts a recovery.
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Tighter than room_navigator's 0.08 m centreline gate, and it has to be.
      # At 0.10 Nav2 was allowed to park 10 cm off a portal pose while the gate
      # refused anything over 8 cm, so a legal arrival could be an illegal state
      # with nothing able to fix it: on 14 Sep it delivered 9.5 cm off and the
      # navigator aborted, correctly, with the robot simply left standing.
      # The doorway itself allows 7.75 cm of lateral error at a square heading,
      # so the gate is not the part that can move.
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.025
    # DWB Local Planner configured for omnidirectional (mecanum) base.
    # Evaluates 15,625 trajectories (25x25x25) at 20 Hz with 1 cm linear granularity.
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: -0.30
      max_vel_x: 0.30
      # Controlled lateral correction: strafe without crabbing or yawing
      min_vel_y: -0.15
      max_vel_y: 0.15
      max_vel_theta: 0.30
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 1.5
      acc_lim_theta: 3.0
      decel_lim_x: -1.5
      decel_lim_y: -1.5
      decel_lim_theta: -3.0
      vx_samples: 25
      vy_samples: 25
      vtheta_samples: 25
      sim_time: 1.2
      linear_granularity: 0.01
      angular_granularity: 0.01
      transform_tolerance: 0.2
      # Must equal general_goal_checker's. RotateToGoalCritic reads THIS one.
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "PathDist", "GoalDist", "Twirling"]
      ObstacleFootprint.scale: 2.0
      PathDist.scale: 96.0
      GoalDist.scale: 24.0
      Twirling.scale: 20.0
      RotateToGoal.scale: 64.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      # 2.5 cm, not the usual 5 cm. A 1.0 m doorway leaves this robot about 4 cm
      # a side, which is under one 5 cm cell: the jamb rounds up to a whole cell
      # inwards and the gap the controller sees closes. Measured on 14 Sep: the
      # local costmap showed 80 cm of free space in a 100 cm doorway, and DWB
      # correctly reported "No valid trajectories out of 3711". The window is
      # only 3 x 3 m, so the extra cells are cheap.
      resolution: 0.025
      # The footprint is no longer an estimate that needs a safety margin: it is
      # the measured convex hull of the robot's own collision geometry,
      # published live (D-19). Padding it again subtracts 2 cm of a 8 cm budget
      # for a robot that is already drawn at its true size.
      footprint_padding: 0.0
      # The measured robot: 1.04 m long, 0.854 m wide in ARM_CARRY_V2 (P-35,
      # agreed to 2 mm by the collision-corridor search and the mesh vertices).
      # Without artificial costmap inflation on local_costmap, ObstacleFootprint
      # checks the exact polygon against real geometry, fitting 1.0 m doors.
      footprint: "[[0.52, 0.427], [-0.52, 0.427], [-0.52, -0.427], [0.52, -0.427]]"
      plugins: ["voxel_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True
      # The controller must see the same table/door keepouts as the planner.
      # Keep local inflation disabled so the measured doorway remains passable.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        filter_info_topic: "/costmap_filter_info"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # Measured 1.04 x 0.854 m in ARM_CARRY_V2 (P-35); see local_costmap.
      # Replaced at runtime by the measured outline (D-19); this is the fallback.
      footprint: "[[0.52, 0.427], [-0.52, 0.427], [-0.52, -0.427], [0.52, -0.427]]"
      footprint_padding: 0.0
      # Stays at 5 cm: the static layer comes from a 5 cm map, so a finer grid
      # here would only upsample it.
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      width: 20
      height: 20
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # At least the inscribed radius (0.427 m); see local_costmap.
        inflation_radius: 0.45
      always_send_full_costmap: True
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        filter_info_topic: "/costmap_filter_info"

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    # Slow the /spin scan so the ~2 Hz RGBD camera reliably catches the marker as
    # it sweeps the FOV (a fast spin skipped past the marker between frames).
    max_rotational_vel: 0.35
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 40.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Matches the omni DWB limits with controlled lateral and reverse support.
    max_velocity: [0.30, 0.30, 0.60]
    min_velocity: [-0.30, -0.30, -0.60]
    max_accel: [1.5, 1.5, 3.0]
    max_decel: [-1.5, -1.5, -3.0]
    odom_topic: "/base_controller/odom"
    odom_duration: 0.05
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: True
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

# /keepout_filter_mask is published by the nav_zones node, not by a map_server
# reading a pre-baked PGM: the zones are derived from the doorways and tables
# the SLAM map actually contains, so they follow the world instead of a file
# somebody remembered to regenerate.
