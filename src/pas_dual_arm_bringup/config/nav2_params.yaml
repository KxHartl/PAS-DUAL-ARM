controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # The previous 0.20 m / 0.25 rad could not work here and was the first
      # reason the robot hit the jamb: the swept width of a 1.04 x 0.854 m
      # robot is 1.04*sin(yaw) + 0.854*cos(yaw), so an accepted 0.25 rad error
      # needs 1.09 m of a 1.0 m doorway, and 0.20 m of lateral slack is four
      # times the ~5 cm the opening leaves. Goals here are doorway portal poses
      # on the lane centreline, so they have to actually be reached.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.05
    # DWB parameters wrapped by RotationShimController to enforce in-place rotation before translation
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      # The shim turns in place until the heading is within this of the path,
      # then hands over. That threshold, not the goal checker, is what decides
      # how square the robot enters a doorway: at the old 0.12 rad the swept
      # width is 0.97 m, wider than the 0.95 m the map reads the opening as.
      # 0.06 rad gives 0.915 m and still leaves the shim room to disengage.
      angular_dist_threshold: 0.06
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.35
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: -0.15
      # Slow turns (notes P-11): keep turns smooth and controlled.
      max_vel_x: 0.3
      # The mecanum base can strafe, which is how lateral error gets corrected
      # inside a lane without yawing. Held well below max_vel_x so it stays a
      # correction and the robot does not crab down the corridor.
      max_vel_y: 0.15
      max_vel_theta: 0.4
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 1.0
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      # ObstacleFootprint checks the actual rectangular polygon footprint along the trajectory
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # ObstacleFootprint is the only critic that checks the real rectangle
      # rather than the robot's centre point, which is exactly what matters in
      # a doorway with 5 cm a side. At 0.02 it was scored but not weighted, so
      # a trajectory grazing the jamb cost the same as one down the middle.
      ObstacleFootprint.scale: 1.0
      # The keepout lane makes the global path the only square way through, so
      # sticking to that path is the behaviour we want. Weighted above the goal
      # critics: reaching the portal by a diagonal shortcut is the failure.
      PathAlign.scale: 48.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 64.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # The measured robot: 1.04 m long, 0.854 m wide in ARM_CARRY_V2 (P-35,
      # agreed to 2 mm by the collision-corridor search and the mesh vertices).
      # The old 0.90 m was a guess that made ObstacleFootprint reject almost
      # every trajectory in a doorway the map reads as 0.95 m wide.
      footprint: "[[0.52, 0.427], [-0.52, 0.427], [-0.52, -0.427], [0.52, -0.427]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # Must be at least the inscribed radius (0.427 m) or Nav2 refuses to
        # plan; larger only starts closing the lane.
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True
      # The controller has to see the doorway guide walls too. With the filter
      # only on the global costmap, DWB was free to cut the corner the planner
      # had been forbidden to take - which is how a square global path still
      # ended up as an angled entry. No static_layer here on purpose: the live
      # scan reports the true 1.0 m opening, while the SLAM map thickens it to
      # 0.95 m, and in a doorway that 5 cm is most of the margin.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        filter_info_topic: "/costmap_filter_info"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # Measured 1.04 x 0.854 m in ARM_CARRY_V2 (P-35); see local_costmap.
      footprint: "[[0.52, 0.427], [-0.52, 0.427], [-0.52, -0.427], [0.52, -0.427]]"
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      width: 20
      height: 20
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # At least the inscribed radius (0.427 m); see local_costmap.
        inflation_radius: 0.45
      always_send_full_costmap: True
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        filter_info_topic: "/costmap_filter_info"

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    # Slow the /spin scan so the ~2 Hz RGBD camera reliably catches the marker as
    # it sweeps the FOV (a fast spin skipped past the marker between frames).
    max_rotational_vel: 0.35
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Matches the slow-turn DWB limits with lateral omni support.
    max_velocity: [0.3, 0.15, 0.4]
    min_velocity: [-0.3, -0.15, -0.4]
    max_accel: [0.5, 0.5, 1.0]
    max_decel: [-0.5, -0.5, -1.0]
    odom_topic: "/base_controller/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: True
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

# /keepout_filter_mask is published by the nav_zones node, not by a map_server
# reading a pre-baked PGM: the zones are derived from the doorways and tables
# the SLAM map actually contains, so they follow the world instead of a file
# somebody remembered to regenerate.

