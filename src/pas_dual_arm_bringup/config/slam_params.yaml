# slam_toolbox for the three-room L world (D-13).
#
# Until now slam_toolbox ran on its stock defaults: nav2_params.yaml has no
# `slam_toolbox:` section, so nav2_bringup/slam_launch.py's HasNodeParams check
# failed and it never passed a params file through. This file is loaded directly
# by mapping.launch.py instead.
#
# The tuning target is P-11: the base slips when it turns in place, wheel odometry
# lies about yaw, and localisation once jumped ~30 m. The answer here is to lean
# less on odometry - add graph nodes more often so scan matching gets a say sooner -
# and to drive slowly (mapping_tour keeps w <= 0.25 rad/s).
#
# Second target, 14 Sep: the map the robot drives on decides how wide the doorway
# is. Measured on the old map (scripts/check_map_geometry.py): a 0.10 m wall was
# drawn 0.15 m thick, so the 1.00 m opening read 0.950 m and its axis sat 1.5 cm
# off - and the robot has 7.3 cm per side. That was 5 cm cells straddling the wall,
# not SLAM: map scale was exact to 0.0 mm. So the grid is now finer than the error
# we are chasing, and the scan matcher is no longer smeared wider than the sensor
# (commit bd61802 put a 1080-beam / 1 mm / 25 Hz lidar on the robot; the previous
# map was recorded before it, on 360 beams at 10 mm).
slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    # mecanum_drive_controller publishes odom -> base_footprint (enable_odom_tf,
    # relayed onto /tf by cmd_vel_relay).
    base_frame: base_footprint
    scan_topic: /scan_filtered
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0          # 5.0 default; we want to watch it build
    # 0.05 rounds a 0.10 m wall out to 0.15 m and takes 2.5 cm per side off a
    # doorway that only has 7.3. At 0.02 the cell is smaller than the clearance
    # it is spending. 12 m of world is then 600 x 600 cells - cheap.
    resolution: 0.02
    # Must not be below what the sensor can do, or slam_toolbox warns on every
    # start. The URDF sets the gpu_lidar's range.min to 0.05 m.
    min_laser_range: 0.05
    # The lidar reports up to 25 m but the rooms are 6 x 6 m and the longest
    # sight line in this world is ~9 m (through a doorway, corner to far wall).
    # Clipping keeps grazing long-range returns off the walls of the far room.
    max_laser_range: 12.0
    # 25 Hz of scans; a node every 0.2 s is still a fifth of them.
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # 0.5 / 0.5 by default. At the tour's 0.15 m/s and 0.25 rad/s that is a node
    # every ~3.3 s of driving or ~2 s of turning, which is where odometry error
    # accumulates unchecked. 0.1 is four times the stock graph density; every metre
    # of wall is then seen from ten poses instead of two, which is what makes a
    # face crisp rather than merely present.
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    # Doubled with the node spacing, so local matching still reaches as far back
    # along the drive as it did before.
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    # The search grid is smeared before correlating, to keep the response surface
    # smooth. At 0.1 the smear is 100x the sensor's 1 mm range resolution and 10x
    # the search grid itself: every candidate pose within a hand's width scores
    # about the same, so the match has nothing fine to lock onto. 0.03 still
    # smooths across three search cells.
    correlation_search_space_smear_deviation: 0.03

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    # Wheel odometry is the untrustworthy input here (P-10 sets mu2 = 0 so the
    # base can rotate at all, which means it slides). Penalising disagreement
    # with odometry less lets the scan matcher override it.
    distance_variance_penalty: 0.5
    angle_variance_penalty: 0.8       # 1.0 default

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
