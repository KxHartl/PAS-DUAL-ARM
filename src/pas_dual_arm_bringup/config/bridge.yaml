---
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

# Base motion and odometry go through ros2_control (mecanum base_controller),
# so no cmd_vel/odom/tf bridging is needed here.

# --- Sensors (Ignition gpu_lidar + camera defined in robot.urdf.xacro) ---
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "ignition.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/image"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Depth image + point cloud from the RGBD camera, for measuring the box
# pose/dimensions before grasping.
- ros_topic_name: "/camera/depth_image"
  gz_topic_name: "/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/points"
  gz_topic_name: "/camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# --- Fingertip contact sensors (defined in robot.urdf.xacro) ---
# Real finger-on-box contact for honest grasp verification before the attach.
# NOTE: the Fortress Contact system IGNORES the sensor's custom <topic> tag and
# always publishes on the default /world/<w>/model/<m>/link/<l>/sensor/<s>/contact
# path (verified live: the short topics had no publisher while these did), so the
# bridge maps the long gz names onto the short ROS names main_task subscribes to.
- ros_topic_name: "/contact/left_left_tip"
  gz_topic_name: "/world/seminar_world/model/dual_arm_robot/link/left_robotiq_85_left_finger_tip_link/sensor/left_left_tip_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "ignition.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "/contact/left_right_tip"
  gz_topic_name: "/world/seminar_world/model/dual_arm_robot/link/left_robotiq_85_right_finger_tip_link/sensor/left_right_tip_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "ignition.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "/contact/right_left_tip"
  gz_topic_name: "/world/seminar_world/model/dual_arm_robot/link/right_robotiq_85_left_finger_tip_link/sensor/right_left_tip_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "ignition.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "/contact/right_right_tip"
  gz_topic_name: "/world/seminar_world/model/dual_arm_robot/link/right_robotiq_85_right_finger_tip_link/sensor/right_right_tip_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "ignition.msgs.Contacts"
  direction: GZ_TO_ROS

# --- DetachableJoint commands and state (Method 2) ---
- ros_topic_name: "/aruco_box/attach"
  gz_topic_name: "/aruco_box/attach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "ignition.msgs.Empty"
  direction: ROS_TO_GZ

- ros_topic_name: "/aruco_box/detach"
  gz_topic_name: "/aruco_box/detach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "ignition.msgs.Empty"
  direction: ROS_TO_GZ

- ros_topic_name: "/aruco_box/state"
  gz_topic_name: "/aruco_box/state"
  ros_type_name: "std_msgs/msg/String"
  gz_type_name: "ignition.msgs.StringMsg"
  direction: GZ_TO_ROS

